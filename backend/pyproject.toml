[project]
name = "orbital-sentinel-backend"
version = "0.1.0"
requires-python = ">=3.10"

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI's Depends() in argument defaults

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
